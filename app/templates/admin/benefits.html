{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 fade-up">
    <div class="d-flex justify-content-between align-items-center mb-5 border-bottom border-secondary pb-3">
        <div>
            <h1 class="text-white fw-bold"><i class="bi bi-gem me-2 text-primary"></i>Bénéfices Clients</h1>
            <p class="text-muted mb-0 small">Gérez les arguments clés de votre offre de service.</p>
        </div>
        <a href="{{ url_for('admin.benefit_new') }}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Ajouter une Valeur
        </a>
    </div>

    <div class="row g-4">
        {% for b in benefits %}
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark border-secondary h-100 shadow-sm hover-border-primary">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="bg-black rounded p-3 border border-secondary">
                            <i class="bi {{ b.icon }} text-primary fs-3"></i>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-link text-muted p-0" data-bs-toggle="dropdown">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item" href="{{ url_for('admin.benefit_edit', id=b.id) }}"><i class="bi bi-pencil me-2"></i>Modifier</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form action="{{ url_for('admin.benefit_delete', id=b.id) }}" method="POST">
                                        <button type="submit" class="dropdown-item text-danger" onclick="return confirm('Supprimer ce bénéfice ?')">
                                            <i class="bi bi-trash me-2"></i>Supprimer
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <h5 class="text-white fw-bold">{{ b.title }}</h5>
                    <p class="text-muted small mb-0">{{ b.description }}</p>
                    <div class="mt-3">
                        <code class="small text-primary-emphasis opacity-50">{{ b.icon }}</code>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

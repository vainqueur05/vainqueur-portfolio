{% extends 'base.html' %}

{% block content %}
<style>
    /* Ajustement Navbar */
    body { padding-top: 100px; background-color: #050505 !important; color: #f0f0f0; }

    .editor-card {
        background: rgba(20, 20, 20, 0.6);
        border: 1px solid rgba(25, 135, 84, 0.2); /* Bordure légère couleur success */
        border-radius: 16px;
        padding: 40px;
        backdrop-filter: blur(10px);
        position: relative;
    }

    /* Tag de version technique */
    .editor-card::after {
        content: "STACK_CONFIG_V1.0";
        position: absolute;
        bottom: 15px;
        right: 20px;
        font-family: 'Fira Code', monospace;
        font-size: 0.6rem;
        color: #198754;
        opacity: 0.4;
    }

    .form-label {
        color: #198754;
        text-transform: uppercase;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 1.2px;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        background: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 8px !important;
        color: white !important;
        padding: 12px 15px;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: #198754 !important;
        box-shadow: 0 0 15px rgba(25, 135, 84, 0.1) !important;
    }

    .icon-preview {
        width: 50px;
        height: 50px;
        background: rgba(25, 135, 84, 0.1);
        border: 1px solid rgba(25, 135, 84, 0.3);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #198754;
        font-size: 1.4rem;
    }

    .btn-save-skill {
        background: #198754;
        border: none;
        color: white;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 12px 30px;
        border-radius: 8px;
        transition: 0.3s;
    }
    .btn-save-skill:hover {
        background: #157347;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
    }
</style>

<div class="container mt-2 fade-up" style="max-width: 700px;">
    <div class="mb-5">
        <span class="text-muted small text-uppercase fw-bold opacity-50">Expertise Technique</span>
        <h2 class="text-white fw-bold">{{ 'Modifier' if skill else 'Nouvelle' }} Compétence</h2>
    </div>

    <div class="editor-card shadow-lg">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-7">
                    <label class="form-label">Nom du Langage / Outil</label>
                    <input type="text" name="name" class="form-control" 
                           placeholder="ex: Python, Flask, React..." 
                           value="{{ skill.name if skill else '' }}" required>
                </div>

                <div class="col-md-5">
                    <label class="form-label">Catégorie</label>
                    <select name="category" class="form-select">
                        <option value="frontend" {{ 'selected' if skill and skill.category == 'frontend' }}>Frontend</option>
                        <option value="backend" {{ 'selected' if skill and skill.category == 'backend' or not skill }}>Backend</option>
                        <option value="ai" {{ 'selected' if skill and skill.category == 'ai' }}>IA & Data</option>
                        <option value="outils" {{ 'selected' if skill and skill.category == 'outils' }}>Outils / DevOps</option>
                    </select>
                </div>

                <div class="col-md-7">
                    <label class="form-label">Icône (Bootstrap Icon)</label>
                    <div class="d-flex gap-3 align-items-center">
                        <div class="icon-preview" id="previewContainer">
                            <i class="bi {{ skill.icon if skill and skill.icon else 'bi-cpu' }}"></i>
                        </div>
                        <input type="text" name="icon" id="iconInput" class="form-control" 
                               placeholder="bi-terminal"
                               value="{{ skill.icon if skill and skill.icon else 'bi-cpu' }}">
                    </div>
                </div>

                <div class="col-md-5">
                    <label class="form-label">Niveau de Maîtrise (%)</label>
                    <div class="input-group">
                        <input type="number" name="level" class="form-control" 
                               min="0" max="100" 
                               value="{{ skill.level if skill else 50 }}">
                        <span class="input-group-text bg-transparent border-secondary text-success fw-bold">%</span>
                    </div>
                </div>

                <div class="col-12 mt-5 pt-3 border-top border-white border-opacity-5 d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('admin.skills') }}" class="text-muted text-decoration-none small fw-bold">
                        <i class="bi bi-arrow-left me-1"></i> ANNULER
                    </a>
                    <button type="submit" class="btn btn-save-skill">
                        <i class="bi bi-hdd-network me-2"></i> ENREGISTRER_STACK
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Preview en temps réel de l'icône
    const iconInput = document.getElementById('iconInput');
    const previewIcon = document.querySelector('#previewContainer i');

    iconInput.addEventListener('input', function(e) {
        let val = e.target.value.trim();
        if(val === "") val = "bi-cpu";
        previewIcon.className = 'bi ' + val;
    });
</script>
{% endblock %}

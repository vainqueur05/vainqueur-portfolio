{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Gestion des témoignages</h1>
    <a href="{{ url_for('admin.testimonial_new') }}" class="btn btn-primary mb-3">Ajouter un témoignage</a>
    <table class="table table-striped">
        <thead>
            <tr><th>ID</th><th>Auteur</th><th>Rôle</th><th>Note</th><th>Actions</th></tr>
        </thead>
        <tbody>
            {% for t in testimonials %}
            <tr>
                <td>{{ t.id }}</td>
                <td>{{ t.author }}</td>
                <td>{{ t.role }}</td>
                <td>{{ t.rating }}/5</td>
                <td>
                    <a href="{{ url_for('admin.testimonial_edit', id=t.id) }}" class="btn btn-sm btn-warning">Modifier</a>
                    <form action="{{ url_for('admin.testimonial_delete', id=t.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ce témoignage ?')">Supprimer</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

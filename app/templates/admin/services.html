{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Gestion des services</h1>
    <a href="{{ url_for('admin.service_new') }}" class="btn btn-primary mb-3">Ajouter un service</a>
    <table class="table table-striped">
        <thead>
            <tr><th>ID</th><th>Titre</th><th>Icône</th><th>Prix</th><th>Actions</th></tr>
        </thead>
        <tbody>
            {% for s in services %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.title }}</td>
                <td>{{ s.icon }}</td>
                <td>{{ s.price }}</td>
                <td>
                    <a href="{{ url_for('admin.service_edit', id=s.id) }}" class="btn btn-sm btn-warning">Modifier</a>
                    <form action="{{ url_for('admin.service_delete', id=s.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ce service ?')">Supprimer</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Gestion des statistiques</h1>
    <a href="{{ url_for('admin.stat_new') }}" class="btn btn-primary mb-3">Ajouter une statistique</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Label</th>
                <th>Valeur</th>
                <th>Icône</th>
                <th>Actions</th>
            </thead>
        <tbody>
            {% for s in stats %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.label }}</td>
                <td>{{ s.value }}</td>
                <td><i class="bi {{ s.icon }}"></i> {{ s.icon }}</td>
                <td>
                    <a href="{{ url_for('admin.stat_edit', id=s.id) }}" class="btn btn-sm btn-warning">Modifier</a>
                    <form action="{{ url_for('admin.stat_delete', id=s.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Supprimer cette statistique ?')">Supprimer</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{{ 'Modifier' if stat else 'Ajouter' }} une statistique</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Label</label>
            <input type="text" name="label" class="form-control" value="{{ stat.label if stat else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Valeur (ex: 15+, 98%, 24/7)</label>
            <input type="text" name="value" class="form-control" value="{{ stat.value if stat else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Icône Bootstrap (ex: bi-folder)</label>
            <input type="text" name="icon" class="form-control" value="{{ stat.icon if stat else 'bi-bar-chart' }}">
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{{ url_for('admin.stats') }}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}

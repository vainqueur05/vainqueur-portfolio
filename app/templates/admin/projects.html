{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 fade-up">
    <div class="d-flex justify-content-between align-items-center mb-5 border-bottom border-secondary pb-3">
        <h1 class="text-white fw-bold"><i class="bi bi-stack me-2 text-primary"></i>Portfolio</h1>
        <a href="{{ url_for('admin.new_project') }}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Nouveau Projet</a>
    </div>

    <div class="row g-4">
        {% for project in projects %}
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark border-secondary h-100 shadow-sm">
                <img src="{{ url_for('static', filename='uploads/' + project.image) }}" class="card-img-top" style="height: 200px; object-fit: cover; opacity: 0.8;">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h5 class="text-white fw-bold">{{ project.title }}</h5>
                        <span class="badge bg-black text-primary border border-primary small">{{ project.category }}</span>
                    </div>
                    <p class="text-muted small mt-2">{{ project.description[:100] }}...</p>
                    <div class="d-flex gap-2 mt-3">
                        <a href="{{ url_for('admin.edit_project', id=project.id) }}" class="btn btn-sm btn-outline-warning w-100">Modifier</a>
                        <form action="{{ url_for('admin.delete_project', id=project.id) }}" method="POST" class="w-100">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100" onclick="return confirm('Supprimer ?')">Supprimer</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

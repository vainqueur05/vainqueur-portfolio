<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance — KAIROS revient bientôt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --accent: #8b5cf6;
            --dark: #050505;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            background: var(--dark); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
            overflow: hidden; position: relative;
        }
        
        /* Background blobs */
        .blob {
            position: fixed; filter: blur(120px);
            opacity: 0.15; z-index: 0;
            animation: float 20s ease-in-out infinite alternate;
        }
        .blob-1 { 
            top: -10%; left: -10%;
            width: 500px; height: 500px;
            background: var(--primary);
        }
        .blob-2 { 
            bottom: -10%; right: -10%;
            width: 600px; height: 600px;
            background: var(--accent);
            animation-delay: -10s;
        }
        @keyframes float {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(50px,30px) scale(1.1); }
        }
        
        .maintenance-card { 
            position: relative; z-index: 2;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(13, 13, 15, 0.7);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 32px; 
            padding: 60px 40px; 
            max-width: 560px; width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        
        .gear-wrapper {
            display: inline-flex;
            width: 100px; height: 100px;
            background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(139,92,246,0.1));
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 28px;
            align-items: center; justify-content: center;
            margin-bottom: 30px;
            position: relative;
        }
        .gear-wrapper::before {
            content: ''; position: absolute; inset: -2px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            z-index: -1; opacity: 0.5;
            animation: rotate-gradient 3s linear infinite;
        }
        @keyframes rotate-gradient {
            to { filter: hue-rotate(360deg); }
        }
        
        .gear-icon { 
            font-size: 3rem; 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: spin 6s linear infinite; 
        }
        @keyframes spin { 
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .status-badge { 
            display: inline-flex;
            align-items: center; gap: 8px;
            background: rgba(245, 158, 11, 0.1); 
            color: #f59e0b; 
            border: 1px solid rgba(245, 158, 11, 0.25); 
            padding: 8px 18px; 
            border-radius: 100px; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 30px;
        }
        .status-badge .dot {
            width: 8px; height: 8px;
            background: #f59e0b;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900; font-size: 2.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .description {
            color: rgba(255,255,255,0.65);
            line-height: 1.7;
            margin-bottom: 30px;
        }
        
        .progress-bar-custom {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
            overflow: hidden; margin-bottom: 30px;
        }
        .progress-bar-custom .fill {
            height: 100%; width: 70%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 100px;
            animation: progress 2s ease-in-out infinite alternate;
        }
        @keyframes progress {
            from { width: 30%; }
            to { width: 80%; }
        }
        
        .actions {
            display: flex; gap: 12px;
            flex-wrap: wrap; justify-content: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000 !important; 
            font-weight: 700;
            padding: 12px 28px; 
            border-radius: 100px; 
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.4);
        }
        
        .btn-secondary-custom {
            background: rgba(255,255,255,0.03);
            color: #fff !important;
            font-weight: 600;
            padding: 12px 24px; 
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08);
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-secondary-custom:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
        }
        
        .footer-info {
            margin-top: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 1px;
        }
        .footer-info strong {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="maintenance-card">
        <div class="gear-wrapper">
            <i class="bi bi-gear-wide-connected gear-icon"></i>
        </div>
        
        <div class="status-badge">
            <span class="dot"></span>
            Mise à jour en cours
        </div>
        
        <h1>
            On peaufine<br>
            <span class="gradient-text">les détails.</span>
        </h1>
        
        <p class="description">
            Quelques lignes de code en train d'être polies pour vous offrir une expérience encore plus rapide. 
            <strong style="color:#fff;">De retour dans quelques instants.</strong>
        </p>
        
        <div class="progress-bar-custom">
            <div class="fill"></div>
        </div>
        
        <div class="actions">
            <a href="https://wa.me/243895288981" class="btn-action">
                <i class="bi bi-whatsapp"></i> Urgence WhatsApp
            </a>
            <a href="mailto:vainqueurkalema035@gmail.com" class="btn-secondary-custom">
                <i class="bi bi-envelope"></i> Email
            </a>
        </div>
        
        <p class="footer-info">
            KAIROS · Admin : <strong>Vainqueur Kalema</strong>
        </p>
    </div>
</body>
</html>
